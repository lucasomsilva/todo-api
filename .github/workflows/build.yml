name: Build and Deploy

trigger:
  branches:
    include:
      - main
      - qa
      - dev
      - feat/environments

pr:
  branches:
    include:
      - main
      - qa
      - dev
      - feat/environments

stages:
  - stage: Build
    displayName: 'Build Project'
    jobs:
      - job: build
        displayName: 'Maven Build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - task: JavaToolInstaller@0
            displayName: 'Set up JDK 21'
            inputs:
              versionSpec: '21'
              jdkSource: 'PreInstalled'
          - task: Maven@4
            displayName: 'Build with Maven'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'package -DskipTests'
          - publish: '$(System.DefaultWorkingDirectory)/target/todo-api.jar'
            artifact: 'drop'

  - stage: DeployToDev
    displayName: 'Deploy to Dev'
    dependsOn: Build
    jobs:
      - deployment: DeployJobDev
        displayName: 'Deploy to dev-environment'
        environment: 'dev-environment'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to Dev App Service'
                  inputs:
                    azureSubscription: 'azure-todo-app-connection'
                    appName: 'todo-api-dev'
                    package: '$(Pipeline.Workspace)/drop/todo-api.jar'
                    appType: 'webAppLinux'

  - stage: DeployToQA
    displayName: 'Deploy to QA'
    dependsOn: DeployToDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployJobQA
        displayName: 'Deploy to qa-environment'
        environment: 'qa-environment'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to QA App Service'
                  inputs:
                    azureSubscription: 'azure-todo-app-connection'
                    appName: 'todo-api-qa'
                    package: '$(Pipeline.Workspace)/drop/todo-api.jar'
                    appType: 'webAppLinux'

  - stage: DeployToProd
    displayName: 'Deploy to Prod'
    dependsOn: DeployToQA
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployJobProd
        displayName: 'Deploy to prod-environment'
        environment: 'prod-environment'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Deploy to Prod App Service'
                  inputs:
                    azureSubscription: 'azure-todo-app-connection'
                    appName: 'todo-api-prod'
                    package: '$(Pipeline.Workspace)/drop/todo-api.jar'
                    appType: 'webAppLinux'