name: Build and Test with SQL Server

on:
  push:
    branches:
      - main
      - feat/pipeline
  pull_request:
    branches:
      - main
      - feat/pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "API-todo2025"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "exit 0"
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Wait for SQL Server to be ready
        run: |
          for i in {1..30}; do
            if /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P "API-todo2025" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready!"
              break
            fi
              echo "Waiting for SQL Server..."
              sleep 2
          done

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:sqlserver://localhost:1433;databaseName=TodoListDB
          SPRING_DATASOURCE_USERNAME: SA
          SPRING_DATASOURCE_PASSWORD: API-todo2025
        run: mvn test
