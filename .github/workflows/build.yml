name: Build and Deploy

on:
  push:
    branches:
      - main
      - qa
      - dev
      - feat/environments
  pull_request:
    branches:
      - main
      - qa
      - dev
      - feat/environments

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: mvn -B package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: todo-api-jar
          path: target/todo-api-0.0.1-SNAPSHOT.jar

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev-environment
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: todo-api-jar
          path: .
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/webapps-deploy@v2
        with:
          app-name: 'todo-api-dev'
          package: todo-api-0.0.1-SNAPSHOT.jar

  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: qa-environment
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: todo-api-jar
          path: .
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/webapps-deploy@v2
        with:
          app-name: 'todo-api-qa'
          package: todo-api-0.0.1-SNAPSHOT.jar

  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod-environment
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: todo-api-jar
          path: .
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/webapps-deploy@v2
        with:
          app-name: 'todo-api-prod'
          package: todo-api-0.0.1-SNAPSHOT.jar