trigger:
  branches:
    include:
      - main
      - dev
      - feat/environments

pr:
  branches:
    include:
      - main
      - dev
      - feat/environments

# Primeiro estágio: Build
stages:
  - stage: Build
    displayName: 'Build Project'
    jobs:
      - job: BuildJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: 'Install JDK 21'
            inputs:
              versionSpec: '21'
              jdkSource: 'PreInstalled'

          - task: Maven@4
            displayName: 'Build with Maven'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'package -DskipTests'
              publishJUnitResults: false

          # Publica o artefato de build, como o arquivo .jar gerado pelo Maven
          - publish: $(System.DefaultWorkingDirectory)/target/seu-projeto.jar
            artifact: 'drop'

  # --- Início dos estágios de deploy ---

  # Segundo estágio: Deploy para o ambiente de Desenvolvimento (dev)
  - stage: DeployToDev
    displayName: 'Deploy to Dev Environment'
    dependsOn: Build # Garante que este estágio só roda depois do estágio 'Build'
    jobs:
      - deployment: DeployDev
        displayName: 'Deploy to Dev'
        environment: 'dev-environment' # Referencia o ambiente que você criou
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                # Baixa o artefato gerado no estágio 'Build'
                - download: current
                  artifact: 'drop'

                # Aqui você adiciona as tarefas de deploy.
                # Pode ser um comando para copiar o arquivo .jar para um servidor,
                # um script para atualizar um contêiner Docker, etc.
                - script: echo 'Deploying to dev-environment...'

  # Terceiro estágio: Deploy para o ambiente de QA (qa)
  - stage: DeployToQA
    displayName: 'Deploy to QA Environment'
    dependsOn: DeployToDev # Garante que este estágio só roda depois do deploy em 'dev'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main')) # Condição para rodar apenas em builds da branch 'main'

    jobs:
      - deployment: DeployQA
        displayName: 'Deploy to QA'
        environment: 'qa-environment' # Referencia o ambiente que você criou
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                # Baixa o artefato novamente
                - download: current
                  artifact: 'drop'

                # Aqui você adiciona as tarefas de deploy para o ambiente de QA
                - script: echo 'Deploying to qa-environment...'