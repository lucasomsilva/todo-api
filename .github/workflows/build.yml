name: Build and Test

on:
  push:
    branches:
      - main
      - feat/pipeline
  pull_request:
    branches:
      - main
      - feat/pipeline

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: "API-todo2025"
        ports:
          - 1433:1433
        options:
          --health-cmd "exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys:  |
          ${{ runner.os }}-maven-

    - name: Build with Maven
      run: mvn clean install

    - name: Wait for SQL Server to be ready
      run: |
        for i in {1..30}; do
          if /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "API-todo2025" -Q "SELECT 1" > /dev/null 2>&1; then
            echo "SQL Server is ready!"
            exit 0
          fi
            echo "Waiting for SQL Server..."
            sleep 2
        done
          echo "SQL Server failed to start."
          exit 1

    - name: Run tests
      run: mvn test

