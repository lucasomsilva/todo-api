name: Build and Deploy

on:
  push:
    branches:
      - main
      - qa
      - dev
      - feat/environments
  pull_request:
    branches:
      - main
      - qa
      - dev
      - feat/environments

# Define os jobs para a pipeline
jobs:
  # Job de Build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-api-jar
          path: target/todo-api.jar

  # Job de Deploy para o ambiente de Desenvolvimento (dev)
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev-environment
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: todo-api-jar

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Dev App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'todo-api-dev'
          package: todo-api.jar

  # Job de Deploy para o ambiente de QA
  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: qa-environment
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: todo-api-jar

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to QA App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'todo-api-qa'
          package: todo-api.jar

  # Job de Deploy para o ambiente de Produção
  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: prod-environment
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: todo-api-jar

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Prod App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'todo-api-prod'
          package: todo-api.jar