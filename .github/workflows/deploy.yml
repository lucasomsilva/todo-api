name: CI/CD Pipeline for SQL Server

on:
  push:
    branches:
      - main
      - qa
      - dev
      - feat/pipeline-sql-config

  pull_request:
    branches:
      - main
      - qa
      - dev
      - feat/pipeline-sql-config

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install mssql-tools
        run: |
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.asc.gpg
          sudo mv microsoft.asc.gpg /etc/apt/trusted.gpg.d/
          echo "deb [arch=amd64] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-prod.list
          sudo apt-get update
          sudo apt-get install -y mssql-tools unixodbc-dev
          echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc
          source ~/.bashrc

      - name: Run SQL script for database setup
        env:
          DB_HOST: todo-api.database.windows.net
          DB_NAME: TodoListDB
          DB_USER: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          /opt/mssql-tools/bin/sqlcmd -S $DB_HOST \
                                     -d $DB_NAME \
                                     -U $DB_USER \
                                     -P $DB_PASSWORD \
                                     -i ./src/main/resources/data.sql

      - name: Build with Maven
        run: mvn -B package -DskipTests