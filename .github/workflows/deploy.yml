name: CI/CD Pipeline for SQL Server

on:
  push:
    branches:
      - main
      - qa
      - dev
      - feat/pipeline-sql-config

  pull_request:
    branches:
      - main
      - qa
      - dev
      - feat/pipeline-sql-config

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install mssql-tools
        run: |
          # Adiciona o repositório da Microsoft, se já não estiver lá
          curl -sS https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          sudo add-apt-repository "$(wget -qO- https://packages.microsoft.com/config/ubuntu/24.04/prod.list)"
          
          # Atualiza a lista de pacotes e instala as ferramentas
          sudo apt-get update
          sudo apt-get install -y mssql-tools unixodbc-dev

      - name: Run SQL script for database setup
        env:
          DB_HOST: todo-api.database.windows.net
          DB_NAME: TodoListDB
          DB_USER: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          /opt/mssql-tools/bin/sqlcmd -S $DB_HOST \
                                     -d $DB_NAME \
                                     -U $DB_USER \
                                     -P $DB_PASSWORD \
                                     -i ./src/main/resources/data.sql

      - name: Build with Maven
        run: mvn -B package -DskipTests